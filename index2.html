<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="西语单词">
<title>西语单词</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif}
.page{max-width:720px;margin:auto;min-height:100vh;padding:22px 18px 40px}.hide{display:none!important}
h1{font-size:30px;margin:8px 0}.sub,.small{color:#777;font-size:13px}.menu{display:grid;gap:12px;margin-top:25px}
.menu button{background:#fff;border:1px solid #e5e5e5;border-radius:17px;padding:19px;text-align:left;box-shadow:0 2px 8px #0000000a}
.menu b{display:block;font-size:18px;margin-bottom:5px}.menu span{color:#777;font-size:13px}
.back{background:none;color:#555;padding:5px 0}.title{font-size:26px;font-weight:750;margin:12px 0}
.card{background:#fff;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 2px 9px #0000000a}
button{border:0;border-radius:11px;padding:12px 14px;font-weight:650;font-size:15px}
.primary{background:#222;color:#fff}.secondary{background:#eef0f3;color:#222}.danger{background:#fff0f0;color:#a00020}
.row{display:flex;gap:9px}.row>*{flex:1}select,input{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;background:#fff;font-size:16px}
label{display:block;font-weight:650;font-size:14px;margin:9px 0 7px}.tabs{display:flex;gap:8px}.tabs>*{flex:1}
.qtype{font-size:13px;color:#777}.question{text-align:center;font-size:29px;font-weight:750;margin:28px 0 7px;word-break:break-word}
.hint{text-align:center;color:#777;font-size:14px;margin-bottom:20px}.options{display:grid;gap:10px}
.option{background:#fff;border:1px solid #ddd;color:#222;text-align:left;font-weight:500}
.correct{background:#eaf7ef!important;border-color:#198754!important}.wrong{background:#fff0f0!important;border-color:#d33!important}
.feedback{text-align:center;font-weight:650;padding:13px 0}.stats{text-align:center;color:#777;font-size:13px;margin:10px}
.unit,.word{padding:13px 0;border-bottom:1px solid #eee}.unit{display:flex;justify-content:space-between;align-items:center}
.unit:last-child,.word:last-child{border-bottom:0}.pos{font-size:12px;color:#777}.zh{margin-top:4px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f7f8;border-radius:12px;padding:12px;text-align:center}
.num{font-size:21px;font-weight:750}.notice{background:#f1f5ff;color:#3157a5;border-radius:11px;padding:11px;font-size:13px;line-height:1.6;margin-top:10px}
hr{border:0;border-top:1px solid #eee;margin:17px 0}
</style>
</head>
<body>
<div id="home" class="page">
<h1>西语单词</h1><div class="sub">长期背词 · 选择 · 默写 · 错题 · 备份</div>
<div class="menu">
<button onclick="openPage('practice')"><b>📖 选择题</b><span>西语 → 中文 / 中文 → 西语</span></button>
<button onclick="openPage('dict')"><b>✍️ 中文默写西语</b><span>看到中文和词性，自己输入西语</span></button>
<button onclick="openPage('wrong')"><b>❌ 错题</b><span>选择题和默写专项复习</span></button>
<button onclick="openPage('library')"><b>📚 我的词库</b><span>按 Unit 管理和添加单词</span></button>
<button onclick="openPage('backup')"><b>💾 数据与备份</b><span>导出 / 恢复全部数据</span></button>
</div></div>

<div id="practice" class="page hide">
<button class="back" onclick="home()">← 返回</button><div class="title">📖 选择题</div>
<div class="card"><label>练习范围</label><select id="punit"></select><label>题型</label>
<div class="tabs"><button id="pes" class="primary" onclick="pmode='es2zh';paintMode()">西语 → 中文</button><button id="pzh" class="secondary" onclick="pmode='zh2es';paintMode()">中文 → 西语</button></div>
<button class="primary" style="width:100%;margin-top:12px" onclick="quizStart(false)">开始</button></div>
<div id="quizcard" class="card hide"><div id="qtype" class="qtype"></div><div id="q" class="question"></div><div id="qh" class="hint"></div>
<div id="opts" class="options"></div><div id="qf" class="feedback"></div><button id="qn" class="secondary hide" style="width:100%" onclick="quizNext()">下一题</button><div id="qs" class="stats"></div></div>
</div>

<div id="dict" class="page hide">
<button class="back" onclick="home()">← 返回</button><div class="title">✍️ 中文默写西语</div>
<div class="card"><label>默写范围</label><select id="dunit"></select><button class="primary" style="width:100%;margin-top:12px" onclick="dictStart(false)">开始默写</button></div>
<div id="dictcard" class="card hide"><div class="qtype">中文 → 西语</div><div id="dq" class="question"></div><div id="dh" class="hint"></div>
<input id="di" placeholder="输入西语单词" autocapitalize="none"><button class="primary" style="width:100%;margin-top:10px" onclick="dictCheck()">检查</button>
<div id="df" class="feedback"></div><button id="dn" class="secondary hide" style="width:100%" onclick="dictNext()">下一题</button><div id="ds" class="stats"></div></div>
</div>

<div id="wrong" class="page hide">
<button class="back" onclick="home()">← 返回</button><div class="title">❌ 错题</div>
<div class="card"><div id="wi" class="small"></div><div class="row"><button class="primary" onclick="wrongQuiz()">错题选择题</button><button class="secondary" onclick="wrongDict()">错题默写</button></div></div>
<div id="wl" class="card"></div>
</div>

<div id="library" class="page hide">
<button class="back" onclick="home()">← 返回</button><div class="title">📚 我的词库</div>
<div class="card"><button class="primary" style="width:100%" onclick="addUnit()">＋ 添加 / 导入 Unit</button><div id="units"></div></div>
<div id="words" class="card hide"></div>
</div>

<div id="backup" class="page hide">
<button class="back" onclick="home()">← 返回</button><div class="title">💾 数据与备份</div>
<div class="card"><div class="statgrid"><div class="stat"><div id="bu" class="num">0</div><div class="small">单元</div></div>
<div class="stat"><div id="bw" class="num">0</div><div class="small">单词</div></div><div class="stat"><div id="bx" class="num">0</div><div class="small">错词</div></div></div><hr>
<button class="primary" style="width:100%" onclick="exportData()">导出备份 JSON</button>
<button class="secondary" style="width:100%;margin-top:9px" onclick="document.getElementById('file').click()">恢复备份</button>
<input id="file" type="file" accept=".json" class="hide">
<div class="notice">建议定期导出 JSON，保存到 iCloud Drive、电脑等位置。换设备后可恢复。</div></div>
</div>

<script>
const KEY="spanish_vocab_final_v4";
let data=JSON.parse(localStorage.getItem(KEY)||'{"units":{},"wrong":{},"stats":{"answered":0,"correct":0}}');
let pmode="es2zh",quiz=[],qi=0,qa=false,dquiz=[],di=0,da=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function all(){let a=[];for(const[u,ws]of Object.entries(data.units))ws.forEach(w=>a.push({...w,unit:u}));return a}
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function unique(a){return a.filter((x,i)=>a.findIndex(y=>y.es===x.es)===i)}
function hint(w){return[w.pos,w.gender].filter(Boolean).join(" · ")}
function openPage(id){document.querySelectorAll(".page").forEach(x=>x.classList.add("hide"));$(id).classList.remove("hide");window.scrollTo(0,0);if(id==="practice")populate("punit");if(id==="dict")populate("dunit");if(id==="wrong")renderWrong();if(id==="library")renderUnits();if(id==="backup")renderBackup()}
function home(){openPage("home")}
function populate(id){$(id).innerHTML='<option value="__all">全部 Unit</option>'+Object.keys(data.units).map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join("")}
function paintMode(){$("pes").className=pmode==="es2zh"?"primary":"secondary";$("pzh").className=pmode==="zh2es"?"primary":"secondary"}
function scope(v){return v==="__all"?all():(data.units[v]||[]).map(w=>({...w,unit:v}))}
function quizStart(wrongOnly){
 let a=scope($("punit").value);if(wrongOnly)a=a.filter(w=>data.wrong[w.es]);
 if(!a.length)return alert("没有可练习的单词。");
 quiz=shuffle(a);qi=0;qa=false;$("quizcard").classList.remove("hide");showQ()
}
function showQ(){
 let w=quiz[qi];qa=false;$("qtype").textContent=pmode==="es2zh"?"西语 → 中文":"中文 → 西语";
 $("q").textContent=pmode==="es2zh"?w.es:w.zh;$("qh").textContent=hint(w);
 let pool=quiz.filter(x=>x.es!==w.es);if(pool.length<3)pool=all().filter(x=>x.es!==w.es);
 let os=shuffle([w,...unique(pool).slice(0,3)]);
 $("opts").innerHTML=os.map(x=>`<button class="option" data-es="${esc(x.es)}">${esc(pmode==="es2zh"?x.zh:x.es)}</button>`).join("");
 document.querySelectorAll(".option").forEach(b=>b.onclick=()=>answer(b,w));
 $("qf").textContent="";$("qn").classList.add("hide");$("qs").textContent=`第 ${qi+1} / ${quiz.length} 题`
}
function answer(b,w){
 if(qa)return;qa=true;let ok=b.dataset.es===w.es;
 document.querySelectorAll(".option").forEach(x=>{if(x.dataset.es===w.es)x.classList.add("correct");if(x===b&&!ok)x.classList.add("wrong")});
 data.stats.answered=(data.stats.answered||0)+1;
 if(ok){data.stats.correct=(data.stats.correct||0)+1;delete data.wrong[w.es]}else data.wrong[w.es]=true;
 save();$("qf").textContent=ok?"✓ 正确":`✗ 正确答案：${w.es}`;$("qn").classList.remove("hide");$("qn").textContent=qi===quiz.length-1?"完成":"下一题"
}
function quizNext(){if(qi<quiz.length-1){qi++;showQ()}else{$("quizcard").classList.add("hide");alert("本轮练习完成！")}}
function dictStart(wrongOnly){
 let a=scope($("dunit").value);if(wrongOnly)a=a.filter(w=>data.wrong[w.es]);
 if(!a.length)return alert("没有可默写的单词。");dquiz=shuffle(a);di=0;da=false;$("dictcard").classList.remove("hide");showD()
}
function showD(){
 let w=dquiz[di];da=false;$("dq").textContent=w.zh;$("dh").textContent=hint(w);$("di").value="";$("di").disabled=false;$("df").textContent="";$("dn").classList.add("hide");$("ds").textContent=`第 ${di+1} / ${dquiz.length} 题`
}
function norm(s){return s.trim().toLowerCase().replace(/\s+/g," ")}
function dictCheck(){
 if(da)return;da=true;let w=dquiz[di],ok=norm($("di").value)===norm(w.es);$("di").disabled=true;
 if(ok){delete data.wrong[w.es];$("df").textContent="✓ 正确"}else{data.wrong[w.es]=true;$("df").textContent=`✗ 正确答案：${w.es}`}
 data.stats.answered=(data.stats.answered||0)+1;data.stats.correct=(data.stats.correct||0)+(ok?1:0);save();$("dn").classList.remove("hide");$("dn").textContent=di===dquiz.length-1?"完成":"下一题"
}
function dictNext(){if(di<dquiz.length-1){di++;showD()}else{$("dictcard").classList.add("hide");alert("本轮默写完成！")}}
function wrongQuiz(){if(!all().some(w=>data.wrong[w.es]))return alert("目前没有错题。");pmode="zh2es";openPage("practice");quizStart(true)}
function wrongDict(){if(!all().some(w=>data.wrong[w.es]))return alert("目前没有错题。");openPage("dict");dictStart(true)}
function renderWrong(){
 let a=all().filter(w=>data.wrong[w.es]);$("wi").textContent=`目前有 ${a.length} 个错词。答对后会自动移出错题。`;
 $("wl").innerHTML=a.length?a.map(w=>`<div class="word"><b>${esc(w.es)}</b> <span class="pos">${esc(hint(w))}</span><div class="zh">${esc(w.zh)}</div></div>`).join(""):"<div class='small'>还没有错题，继续保持！</div>"
}
function addUnit(){
 let n=prompt("Unit 名称，例如：Unidad 1");if(!n)return;
 let raw=prompt("推荐格式（每行一个）：\ncasa | f. | 房子\nhablar | v. | 说话\nimportante | adj. | 重要的\n\n也支持：casa 房子");if(!raw)return;
 let ws=[];raw.split(/\n/).forEach(l=>{l=l.trim();if(!l)return;let a=l.split("|").map(x=>x.trim());
 if(a.length>=3)ws.push({es:a[0],pos:a[1],zh:a.slice(2).join(" | ")});
 else{let m=l.match(/^(\S+)\s+(.+)$/);if(m)ws.push({es:m[1],zh:m[2]})}});
 if(!ws.length)return alert("没有识别到单词。");data.units[n]=ws;save();renderUnits();alert(`已添加 ${ws.length} 个单词。`)
}
function renderUnits(){
 $("units").innerHTML=Object.keys(data.units).length?Object.entries(data.units).map(([u,ws])=>`<div class="unit"><div><b>${esc(u)}</b><div class="small">${ws.length} 个单词</div></div><div class="row"><button class="secondary" onclick='viewUnit(${JSON.stringify(u)})'>查看</button><button class="danger" onclick='delUnit(${JSON.stringify(u)})'>删</button></div></div>`).join(""):"<div class='small' style='padding:12px 0'>还没有词库。</div>"
}
function viewUnit(u){$("words").classList.remove("hide");$("words").innerHTML=`<h3>${esc(u)}</h3>`+data.units[u].map(w=>`<div class="word"><b>${esc(w.es)}</b> <span class="pos">${esc(hint(w))}</span><div class="zh">${esc(w.zh)}</div></div>`).join("")}
function delUnit(u){if(confirm(`确定删除 ${u} 吗？`)){delete data.units[u];save();renderUnits();$("words").classList.add("hide")}}
function renderBackup(){$("bu").textContent=Object.keys(data.units).length;$("bw").textContent=all().length;$("bx").textContent=Object.keys(data.wrong).length}
function exportData(){
 let p={app:"西语单词长期版",version:4,exportedAt:new Date().toISOString(),data};
 let b=new Blob([JSON.stringify(p,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download=`西语单词备份_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
$("file").onchange=e=>{
 let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{
 try{let p=JSON.parse(r.result),d=p.data||p;if(!d.units||!d.wrong)throw 0;
 if(!confirm("恢复备份会覆盖当前数据，确定吗？"))return;data=d;save();renderBackup();alert("恢复成功！")}
 catch{alert("无法识别这个备份文件。")}
 };r.readAsText(f);e.target.value=""
}
</script></body></html>
