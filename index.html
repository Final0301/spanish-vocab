<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>西语单词长期版 v10</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif}.app{max-width:760px;margin:auto;background:#fff;min-height:100vh}.top{position:sticky;top:0;background:white;border-bottom:1px solid #eee;padding:14px;display:flex;gap:10px;align-items:center}.top h1{font-size:20px;margin:0;flex:1}main{padding:16px}.page{display:none}.page.active{display:block}.hidden{display:none!important}button{border:0;border-radius:14px;padding:13px 15px;background:#111;color:white;font-weight:600}.back,.secondary{background:#eee;color:#111}.danger{background:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bigbtn{min-height:80px;text-align:left;font-size:18px}.bigbtn span{display:block;font-size:13px;font-weight:400;margin-top:5px;opacity:.7}.card{border:1px solid #e5e5e5;border-radius:18px;padding:16px;margin:12px 0}label{display:block;font-weight:700;margin:14px 0 8px}input,textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;font:inherit}textarea{height:420px;resize:vertical;font-size:16px;line-height:1.6;white-space:pre-wrap}.help,.notice{background:#f4f4f4;border-radius:14px;padding:12px;font-size:14px;line-height:1.6;color:#555}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}.listrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #eee}.word{text-align:center;font-size:30px;font-weight:750;margin:30px 0 18px}.prompt{text-align:center;font-size:20px;line-height:1.6;margin:25px 0}.pill{background:#eee;border-radius:99px;padding:3px 9px;font-size:12px}.options{display:grid;gap:10px}.options button{background:#f1f1f1;color:#111;text-align:left}.options .correct{background:#dff5e5}.options .wrong{background:#ffe1e1}.result{text-align:center;font-weight:700;min-height:28px;margin:12px}.center{text-align:center}.muted,.small{color:#777}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app">
<header class="top"><button id="back" class="back hidden" onclick="go('home')">‹ 返回</button><h1 id="title">西语单词长期版</h1></header><main>
<section id="home" class="page active"><h2>西语单词长期版</h2><p class="muted">自选 Unit · 自动跳过已掌握单词 · 错题长期保留</p><div class="card"><b>学习进度</b><p id="progressSummary" class="muted">已掌握 0 个单词</p><button class="secondary" onclick="clearLearned()">重置已掌握记录</button></div><div class="grid">
<button class="bigbtn" onclick="go('quiz')">选择题<span>西语→中文 / 中文→西语</span></button><button class="bigbtn" onclick="go('dict')">中文默写西语<span>输入答案，自动判断</span></button><button class="bigbtn" onclick="go('wrong')">错题训练<span>选择题 / 默写</span></button><button class="bigbtn" onclick="go('vocab')">我的词库<span>Unit 与批量录入</span></button><button class="bigbtn" onclick="go('backup')">数据与备份<span>导出 / 导入 JSON</span></button></div></section>
<section id="vocab" class="page"><h2>我的词库</h2><div class="card"><label>Unit 名称</label><input id="unitName" placeholder="例如：Unidad 14"><label>批量输入单词</label><div class="help">格式：<b>西语 | 词性 | 中文</b><br>例：<b>cuyo, ya | adj.rel. | 他的，她的，它的</b><br><b>enamorar(se) de | tr.;prnl. | 使爱上；爱上</b><br>支持半角 | 和全角 ｜。西语里的空格、逗号、括号、de 等完整保留。回车只换行，不自动保存。</div><textarea id="bulk" spellcheck="false" placeholder="一行一个词条&#10;&#10;cuyo, ya | adj.rel. | 他的，她的，它的&#10;hermoso, sa | adj. | 美丽的，漂亮的"></textarea><div class="actions"><button id="saveUnitBtn" onclick="saveUnit()">保存 Unit</button><button class="secondary" onclick="document.getElementById('bulk').value=''">清空输入</button><button id="cancelEditBtn" class="secondary hidden" onclick="cancelEdit()">取消修改</button></div><div id="parseInfo" class="notice hidden"></div></div><div class="card"><h3>已有 Unit</h3><div id="units"></div></div></section>
<section id="quiz" class="page"><h2>选择题</h2><div id="quizSetup" class="card"></div><div class="actions"><button onclick="startQuiz('sc')">西语 → 中文</button><button onclick="startQuiz('cs')">中文 → 西语</button></div><div id="quizArea"></div></section>
<section id="dict" class="page"><h2>中文默写西语</h2><div id="dictSetup" class="card"></div><button style="width:100%" onclick="startDict()">开始打乱默写</button><div id="dictArea"></div></section>
<section id="wrong" class="page"><h2>错题训练</h2><div class="actions"><button onclick="startWrong('choice')">错题选择题</button><button onclick="startWrong('dict')">错题默写</button></div><div id="wrongArea"></div></section>
<section id="backup" class="page"><h2>数据与备份</h2><div class="card"><p>数据保存在当前浏览器，建议定期导出 JSON。</p><div class="actions"><button onclick="exportData()">导出数据</button><button class="secondary" onclick="document.getElementById('file').click()">导入数据</button></div><input id="file" class="hidden" type="file" accept=".json" onchange="importData(event)"></div></section>
</main></div>
<script>
const KEY='spanish_vocab_v8';let db=load(),S={mode:'',list:[],i:0,score:0},editingUnit=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.units){x.wrong=x.wrong||{};x.learned=x.learned||{};x.selectedUnits=x.selectedUnits||Object.keys(x.units);return x}}catch(e){}return {units:{},wrong:{},learned:{},selectedUnits:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));updateProgress()}
function updateProgress(){let a=all(),n=a.filter(w=>db.learned[w.id]).length;let el=document.getElementById('progressSummary');if(el)el.textContent='已掌握 '+n+' / '+a.length+' 个单词；未掌握 '+(a.length-n)+' 个。答对后会自动记录，下次练习自动跳过。'}
function clearLearned(){if(confirm('确定重置所有已掌握记录吗？词库和错题不会删除。')){db.learned={};save();renderUnits();renderStudySetup('quizSetup');renderStudySetup('dictSetup');alert('已重置掌握记录。')}}
function uid(){return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
function all(){return Object.values(db.units).flat()}
function spanishLabel(word){let w=all().find(x=>norm(x.word)===norm(word));return esc(word)+(w&&w.pos?' <span class=\"pill\">'+esc(w.pos)+'</span>':'')}
function answerLabel(w){return esc(w.word)+(w.pos?' ['+esc(w.pos)+']':'')}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('back').classList.toggle('hidden',id==='home');document.getElementById('title').textContent=({home:'西语单词长期版',vocab:'我的词库',quiz:'选择题',dict:'中文默写西语',wrong:'错题训练',backup:'数据与备份'})[id];if(id==='vocab')renderUnits();if(id==='quiz')renderStudySetup('quizSetup');if(id==='dict'){renderStudySetup('dictSetup');document.getElementById('dictArea').innerHTML=''}if(id==='wrong')showWrong();updateProgress()}
function parseLine(line){let s=String(line).trim();if(!s)return null;s=s.replace(/[｜¦]/g,'|');let p=s.split('|');if(p.length>=3){let word=p[0].trim(),pos=p[1].trim(),zh=p.slice(2).join('|').trim();if(word&&zh)return {id:uid(),word,pos,zh}}let m=s.match(/^(.+?)\s+([\u4e00-\u9fff].*)$/);return m?{id:uid(),word:m[1].trim(),pos:'',zh:m[2].trim()}:null}
function saveUnit(){let n=document.getElementById('unitName').value.trim(),txt=document.getElementById('bulk').value;if(!n)return alert('请填写 Unit 名称');if(editingUnit&&n!==editingUnit&&Object.prototype.hasOwnProperty.call(db.units,n)&&!confirm('已有同名 Unit「'+n+'」，保存会覆盖它，是否继续？'))return;let lines=txt.replace(/\r\n?/g,'\n').split('\n'),words=[],bad=[];lines.forEach((l,i)=>{if(!l.trim())return;let w=parseLine(l);w?words.push(w):bad.push('第'+(i+1)+'行：'+l)});if(!words.length)return alert('没有识别到词条，请使用：西语 | 词性 | 中文');if(bad.length&&!confirm('识别到 '+words.length+' 条，以下 '+bad.length+' 行未识别：\n'+bad.slice(0,6).join('\n')+'\n\n仍要保存已识别的词条吗？'))return;let oldWords=(editingUnit&&db.units[editingUnit])||db.units[n]||[];let oldByWord=new Map(oldWords.map(w=>[norm(w.word),w]));words=words.map(w=>{let old=oldByWord.get(norm(w.word));if(old){w.id=old.id;oldByWord.delete(norm(w.word))}return w});let oldName=editingUnit;if(oldName&&oldName!==n){delete db.units[oldName];db.selectedUnits=(db.selectedUnits||[]).map(x=>x===oldName?n:x)}db.units[n]=words;db.selectedUnits=db.selectedUnits||[];if(!db.selectedUnits.includes(n))db.selectedUnits.push(n);editingUnit=null;setEditMode(false);document.getElementById('unitName').value='';document.getElementById('bulk').value='';save();renderUnits();renderStudySetup('quizSetup');renderStudySetup('dictSetup');document.getElementById('parseInfo').classList.remove('hidden');document.getElementById('parseInfo').textContent='已保存 '+words.length+' 个词条。';alert('保存成功：'+words.length+' 个词条。')}
function setEditMode(on){document.getElementById('saveUnitBtn').textContent=on?'保存修改':'保存 Unit';document.getElementById('cancelEditBtn').classList.toggle('hidden',!on)}
function editUnitByIndex(i){let n=Object.keys(db.units)[i];if(n===undefined)return;editingUnit=n;document.getElementById('unitName').value=n;document.getElementById('bulk').value=(db.units[n]||[]).map(w=>w.word+' | '+(w.pos||'')+' | '+w.zh).join('\n');setEditMode(true);document.getElementById('parseInfo').classList.add('hidden');document.getElementById('unitName').scrollIntoView({behavior:'smooth',block:'center'})}
function cancelEdit(){editingUnit=null;setEditMode(false);document.getElementById('unitName').value='';document.getElementById('bulk').value='';document.getElementById('parseInfo').classList.add('hidden')}
function renderUnits(){let b=document.getElementById('units'),ns=Object.keys(db.units);b.innerHTML=ns.length?ns.map((n,i)=>{let a=db.units[n],k=a.filter(w=>db.learned[w.id]).length;return '<div class=\"listrow\"><div style=\"min-width:0;overflow-wrap:anywhere\"><b>'+esc(n)+'</b><div class=\"small\">'+a.length+' 个词 · 已掌握 '+k+' 个</div></div><div class=\"actions\" style=\"margin:0;flex-shrink:0\"><button class=\"secondary\" onclick=\"editUnitByIndex('+i+')\">修改</button><button class=\"danger\" onclick=\"delUnitByIndex('+i+')\">删除</button></div></div>'}).join(''):'<span class=\"muted\">还没有 Unit</span>';updateProgress()}
function delUnitByIndex(i){let n=Object.keys(db.units)[i];if(n===undefined)return;if(!confirm('确定删除词库「'+n+'」吗？此操作会删除该 Unit，但不会删除其他词库。'))return;let removed=db.units[n]||[];delete db.units[n];let remainingIds=new Set(all().map(w=>w.id));removed.forEach(w=>{if(!remainingIds.has(w.id)){delete db.learned[w.id];delete db.wrong[w.id]}});db.selectedUnits=(db.selectedUnits||[]).filter(x=>x!==n);if(editingUnit===n)cancelEdit();save();renderUnits();renderStudySetup('quizSetup');renderStudySetup('dictSetup');alert('已删除词库：'+n)}
function renderStudySetup(id){let b=document.getElementById(id);if(!b)return;let ns=Object.keys(db.units);if(!db.selectedUnits||!db.selectedUnits.length)db.selectedUnits=[...ns];b.innerHTML='<b>选择学习词库</b><p class="small">可以勾选一个或多个 Unit。单词会合并并随机排序；已掌握的单词会自动跳过。</p>'+(ns.length?ns.map(n=>'<label style="font-weight:500;margin:10px 0"><input type="checkbox" style="width:auto;margin-right:8px" data-unit="'+esc(n)+'" '+(db.selectedUnits.includes(n)?'checked':'')+' onchange="updateSelectedUnits()">'+esc(n)+'（'+db.units[n].length+' 个）</label>').join(''):'<p>请先在“我的词库”添加 Unit。</p>')+'<div class="actions"><button class="secondary" onclick="selectAllUnits(true)">全选</button><button class="secondary" onclick="selectAllUnits(false)">全不选</button></div>'}
function updateSelectedUnits(){db.selectedUnits=[...document.querySelectorAll('.page.active input[data-unit]:checked')].map(x=>x.dataset.unit);save()}
function selectAllUnits(on){document.querySelectorAll('.page.active input[data-unit]').forEach(x=>x.checked=on);updateSelectedUnits()}
function selectedWords(){let names=db.selectedUnits||Object.keys(db.units);let a=names.flatMap(n=>db.units[n]||[]);return a.filter(w=>!db.learned[w.id])}
function opts(correct,field){let pool=all().map(w=>w[field]).filter(v=>v&&norm(v)!==norm(correct)),out=[],seen=new Set();pool.sort(()=>Math.random()-.5);for(let v of pool){let k=norm(v);if(!seen.has(k)){seen.add(k);out.push(v)}if(out.length===3)break}let a=[correct,...out];return a.sort(()=>Math.random()-.5)}
function startQuiz(mode){updateSelectedUnits();let a=selectedWords();if(!Object.keys(db.units).length)return alert('请先录入单词');if(!a.length)return alert('所选词库中的单词都已掌握，或尚未选择词库。可以更换 Unit，或重置已掌握记录。');S={mode,list:[...a].sort(()=>Math.random()-.5),i:0,score:0};quizRender()}
function quizRender(){let b=document.getElementById('quizArea');if(S.i>=S.list.length){b.innerHTML='<div class="card center"><h3>完成</h3><p>得分 '+S.score+' / '+S.list.length+'</p><button onclick="startQuiz('+JSON.stringify(S.mode)+')">再来一次</button></div>';return}let w=S.list[S.i],f=S.mode==='sc'?'zh':'word',correct=w[f],q=S.mode==='sc'?spanishLabel(w.word):esc(w.zh);let a=opts(correct,f);b.innerHTML='<div class="word">'+q+'</div><div class="options">'+a.map((v,i)=>'<button data-i="'+i+'" onclick="answerQuiz(this)">'+(S.mode==='cs'?spanishLabel(v):esc(v))+'</button>').join('')+'</div><div class="result" id="qr"></div><div class="small center">'+(S.i+1)+' / '+S.list.length+'</div>';b.dataset.ci=String(a.findIndex(v=>norm(v)===norm(correct)));b.dataset.cv=encodeURIComponent(correct);b.dataset.wid=w.id;b.dataset.answer=encodeURIComponent(answerLabel(w))}
function answerQuiz(btn){let b=document.getElementById('quizArea'),ci=b.dataset.ci,c=decodeURIComponent(b.dataset.cv),ok=btn.dataset.i===ci;document.querySelectorAll('#quizArea .options button').forEach(x=>{x.disabled=true;if(x.dataset.i===ci)x.classList.add('correct')});if(ok){S.score++;db.learned[b.dataset.wid]=true}else{btn.classList.add('wrong');db.wrong[b.dataset.wid]=true}save();document.getElementById('qr').textContent=ok?'正确 ✓':'错误，正确答案：'+c;setTimeout(()=>{S.i++;quizRender()},700)}
function startDict(){updateSelectedUnits();let a=selectedWords();if(!Object.keys(db.units).length){document.getElementById('dictArea').innerHTML='<div class="card">请先录入单词。</div>';return}if(!a.length){document.getElementById('dictArea').innerHTML='<div class="card">所选词库中的单词都已掌握，或尚未选择词库。可以更换 Unit，或重置已掌握记录。</div>';return}S={list:[...a].sort(()=>Math.random()-.5),i:0,score:0};dictRender()}
function dictRender(){let b=document.getElementById('dictArea');if(S.i>=S.list.length){b.innerHTML='<div class="card center"><h3>完成</h3><p>正确 '+S.score+' / '+S.list.length+'</p><button onclick="startDict()">再来一次</button></div>';return}let w=S.list[S.i];b.innerHTML='<div class="prompt">'+esc(w.zh)+'</div><input id="da" placeholder="输入西语" autocapitalize="off"><button style="width:100%;margin-top:12px" onclick="answerDict()">检查</button><div class="result" id="dr"></div><div class="small center">'+(S.i+1)+' / '+S.list.length+'</div>'}
function answerDict(){let w=S.list[S.i],ok=norm(document.getElementById('da').value)===norm(w.word);if(ok){S.score++;db.learned[w.id]=true}else db.wrong[w.id]=true;save();document.getElementById('dr').innerHTML=ok?'正确 ✓':'正确答案：'+answerLabel(w);setTimeout(()=>{S.i++;dictRender()},850)}
function showWrong(){document.getElementById('wrongArea').innerHTML='<div class="card center">当前错题：<b>'+Object.keys(db.wrong).length+'</b> 个<p class="small">错题会长期保留，答对后也不会自动移除。</p></div>'}
function startWrong(mode){let a=all().filter(w=>db.wrong[w.id]);if(!a.length){document.getElementById('wrongArea').innerHTML='<div class="card">目前没有错题。</div>';return}S={mode,list:[...a].sort(()=>Math.random()-.5),i:0,score:0};mode==='choice'?wrongChoiceRender():wrongDictRender()}
function wrongChoiceRender(){let b=document.getElementById('wrongArea');if(S.i>=S.list.length){b.innerHTML='<div class="card center">完成：'+S.score+' / '+S.list.length+'</div>';return}let w=S.list[S.i],a=opts(w.word,'word');b.innerHTML='<div class="prompt">'+esc(w.zh)+'</div><div class="options">'+a.map((v,i)=>'<button data-i="'+i+'" onclick="answerWrongChoice(this)">'+spanishLabel(v)+'</button>').join('')+'</div><div class="result" id="wr"></div>';b.dataset.answer=encodeURIComponent(answerLabel(w));b.dataset.ci=String(a.findIndex(v=>norm(v)===norm(w.word)));b.dataset.cv=encodeURIComponent(w.word);b.dataset.wid=w.id}
function answerWrongChoice(btn){let b=document.getElementById('wrongArea'),ci=b.dataset.ci,c=decodeURIComponent(b.dataset.cv),ok=btn.dataset.i===ci;document.querySelectorAll('#wrongArea .options button').forEach(x=>{x.disabled=true;if(x.dataset.i===ci)x.classList.add('correct')});if(ok){S.score++;db.learned[b.dataset.wid]=true}else btn.classList.add('wrong');save();document.getElementById('wr').innerHTML=ok?'正确 ✓':'正确答案：'+decodeURIComponent(b.dataset.answer||encodeURIComponent(esc(c)));setTimeout(()=>{S.i++;wrongChoiceRender()},700)}
function wrongDictRender(){let b=document.getElementById('wrongArea');if(S.i>=S.list.length){b.innerHTML='<div class="card center">完成：'+S.score+' / '+S.list.length+'</div>';return}let w=S.list[S.i];b.innerHTML='<div class="prompt">'+esc(w.zh)+'</div><input id="wa" placeholder="输入西语"><button style="width:100%;margin-top:12px" onclick="answerWrongDict()">检查</button><div class="result" id="wr"></div>'}
function answerWrongDict(){let w=S.list[S.i],ok=norm(document.getElementById('wa').value)===norm(w.word);if(ok){S.score++;db.learned[w.id]=true}else db.wrong[w.id]=true;save();document.getElementById('wr').innerHTML=ok?'正确 ✓':'正确答案：'+answerLabel(w);setTimeout(()=>{S.i++;wrongDictRender()},850)}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='spanish_vocab_backup_v10.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.units)throw Error();x.wrong=x.wrong||{};x.learned=x.learned||{};x.selectedUnits=x.selectedUnits||Object.keys(x.units);db=x;save();renderUnits();renderStudySetup('quizSetup');renderStudySetup('dictSetup');alert('导入成功')}catch(err){alert('文件格式不正确')}};r.readAsText(f)}
</script></body></html>
