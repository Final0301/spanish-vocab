<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>西语单词长期版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eee;padding:14px 18px;display:flex;align-items:center;gap:10px}.top h1{margin:0;font-size:20px;flex:1}.back{background:#eee;color:#111;padding:10px 14px}.hidden{display:none!important}main{padding:18px}.page{display:none}.page.active{display:block}.hero{padding:18px 0 22px}.hero h2{font-size:30px;margin:0 0 8px}.muted,.small{color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #e5e5e5;border-radius:20px;padding:17px;margin:12px 0}.bigbtn{width:100%;min-height:82px;text-align:left;font-size:18px}.bigbtn span{display:block;font-size:13px;font-weight:400;opacity:.7;margin-top:5px}label{display:block;font-weight:700;margin:15px 0 8px}input,textarea{width:100%;border:1px solid #ddd;border-radius:15px;padding:14px;background:#fff;color:#111}textarea{height:430px;min-height:430px;resize:vertical;font-size:17px;line-height:1.65;white-space:pre-wrap;overflow-wrap:break-word}button{border:0;border-radius:15px;padding:14px 16px;background:#111;color:#fff;font-weight:600}button:disabled{opacity:.55}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}.secondary{background:#eee;color:#111}.danger{background:#b42318}.help{background:#f4f4f4;border-radius:16px;padding:13px;color:#666;font-size:14px;line-height:1.65}.listrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 0;border-bottom:1px solid #eee}.listrow:last-child{border-bottom:0}.word{text-align:center;font-size:30px;font-weight:750;margin:32px 0 18px}.prompt{text-align:center;font-size:20px;line-height:1.6;margin:25px 0}.pill{display:inline-block;background:#eee;border-radius:999px;padding:3px 9px;font-size:12px}.options{display:grid;gap:10px}.options button{background:#f1f1f1;color:#111;text-align:left}.options button.correct{background:#dff5e5}.options button.wrong{background:#ffe1e1}.result{text-align:center;font-weight:700;min-height:28px;margin:12px}.center{text-align:center}@media(max-width:520px){main{padding:15px}.grid{grid-template-columns:1fr}.hero h2{font-size:27px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><button id="back" class="back hidden" onclick="go('home')">‹ 返回</button><h1 id="title">西语单词长期版</h1></header>
<main>
<section id="home" class="page active">
<div class="hero"><h2>西语单词长期版</h2><div class="muted">按 Unit 学习 · 自动出题 · 默写 · 错题</div></div>
<div class="grid">
<button class="bigbtn" onclick="go('quiz')">选择题<span>西语→中文 / 中文→西语</span></button>
<button class="bigbtn" onclick="go('dict')">中文默写西语<span>输入答案，自动判断</span></button>
<button class="bigbtn" onclick="go('wrong')">错题训练<span>选择题 / 默写</span></button>
<button class="bigbtn" onclick="go('vocab')">我的词库<span>Unit 与批量录入</span></button>
<button class="bigbtn" onclick="go('backup')">数据与备份<span>导出 / 导入 JSON</span></button>
</div>
</section>

<section id="vocab" class="page">
<h2>我的词库</h2>
<div class="card">
<label>Unit 名称</label>
<input id="unitName" placeholder="例如：u14 或 Unidad 14">
<label>批量输入单词</label>
<div class="help">
推荐：<b>casa | f. | 房子</b><br>
动词：<b>hablar | v. | 说话</b><br>
教材式：<b>cuyo, ya | adj.rel. | 他的，她的，它的</b><br>
<b>enamorar(se) de | tr.;prnl. | 使爱上；爱上</b><br>
支持半角 <b>|</b> 和全角 <b>｜</b>。词条里的空格、逗号、括号、de 等都会保留。<b>回车只换行，不会自动保存。</b>
</div>
<textarea id="bulk" spellcheck="false" placeholder="一行一个词条

cuyo, ya | adj.rel. | 他的，她的，它的
hermoso, sa | adj. | 美丽的，漂亮的
enamorar(se) de | tr.;prnl. | 使爱上；爱上"></textarea>
<div class="actions"><button onclick="saveUnit()">保存 Unit</button><button class="secondary" onclick="document.getElementById('bulk').value=''">清空输入</button></div>
</div>
<div class="card"><h3>已有 Unit</h3><div id="units"></div></div>
</section>

<section id="quiz" class="page"><h2>选择题</h2><div class="actions"><button onclick="startQuiz('sc')">西语 → 中文</button><button onclick="startQuiz('cs')">中文 → 西语</button></div><div id="quizArea"></div></section>
<section id="dict" class="page"><h2>中文默写西语</h2><div id="dictArea"></div></section>
<section id="wrong" class="page"><h2>错题训练</h2><div class="actions"><button onclick="startWrong('choice')">错题选择题</button><button onclick="startWrong('dict')">错题默写</button></div><div id="wrongArea"></div></section>
<section id="backup" class="page"><h2>数据与备份</h2><div class="card"><p>词库保存在当前浏览器。建议定期导出 JSON。</p><div class="actions"><button onclick="exportData()">导出数据</button><button class="secondary" onclick="document.getElementById('file').click()">导入数据</button></div><input id="file" class="hidden" type="file" accept=".json" onchange="importData(event)"></div></section>
</main>
</div>
<script>
const KEY='spanish_vocab_v7';
let db=JSON.parse(localStorage.getItem(KEY)||'{"units":{},"wrong":{}}');
let state={mode:'',list:[],i:0,score:0};

function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
function allWords(){return Object.values(db.units).flat()}
function go(id){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.getElementById('back').classList.toggle('hidden',id==='home');
 document.getElementById('title').textContent={home:'西语单词长期版',vocab:'我的词库',quiz:'选择题',dict:'中文默写西语',wrong:'错题训练',backup:'数据与备份'}[id];
 if(id==='vocab')renderUnits();
 if(id==='dict')startDict();
 if(id==='wrong')showWrongHome();
}

/* 核心修复：只把竖线作为字段分隔符；支持全角竖线，西语词条本身不会按空格拆分 */
function parseLine(line){
 const raw=line.trim();
 if(!raw)return {item:null,reason:'空行'};
 const s=raw.replace(/[｜¦]/g,'|');
 const parts=s.split('|').map(x=>x.trim());
 if(parts.length>=3){
   const word=parts[0];
   const pos=parts[1];
   const zh=parts.slice(2).join(' | ').trim();
   if(word && zh)return {item:{word,pos,zh},reason:null};
 }
 const old=s.match(/^(.+?)\s+([\u4e00-\u9fff].*)$/);
 if(old)return {item:{word:old[1].trim(),pos:'',zh:old[2].trim()},reason:null};
 return {item:null,reason:'格式不是“西语 | 词性 | 中文”'};
}
function parseBulk(text){
 const lines=text.replace(/\r\n?/g,'\n').split('\n');
 const items=[],bad=[];
 lines.forEach((line,i)=>{
   if(!line.trim())return;
   const r=parseLine(line);
   if(r.item)items.push(r.item);else bad.push({line:i+1,text:line.trim(),reason:r.reason});
 });
 return {items,bad};
}
function saveUnit(){
 const name=document.getElementById('unitName').value.trim();
 const text=document.getElementById('bulk').value;
 if(!name){alert('请填写 Unit 名称');return}
 const r=parseBulk(text);
 if(!r.items.length){alert('没有识别到有效词条。\n例如：caballo | m. | 马');return}
 if(r.bad.length){
   let msg='已识别 '+r.items.length+' 个词条。\\n有 '+r.bad.length+' 行未识别：\\n\\n';
   msg+=r.bad.slice(0,5).map(x=>'第'+x.line+'行：'+x.text).join('\\n');
   if(r.bad.length>5)msg+='\\n……';
   msg+='\\n\\n是否保存已识别的词条？';
   if(!confirm(msg))return;
 }
 db.units[name]=r.items;
 persist();
 renderUnits();
 alert('保存成功：'+name+'\\n共 '+r.items.length+' 个词条。');
}
function renderUnits(){
 const box=document.getElementById('units'), names=Object.keys(db.units);
 if(!names.length){box.innerHTML='<div class="muted">还没有 Unit</div>';return}
 box.innerHTML=names.map(n=>`<div class="listrow"><div><b>${esc(n)}</b><div class="small">${db.units[n].length} 个词</div></div><button class="danger" onclick="deleteUnit(${JSON.stringify(n)})">删除</button></div>`).join('');
}
function deleteUnit(n){if(confirm('确定删除 '+n+'？')){delete db.units[n];persist();renderUnits()}}
function options(correct,field){
 const pool=[...new Set(allWords().map(w=>w[field]).filter(x=>x&&x!==correct))].sort(()=>Math.random()-.5);
 return [correct,...pool.slice(0,3)].sort(()=>Math.random()-.5);
}
function startQuiz(mode){
 const a=allWords();if(!a.length){alert('请先录入单词');return}
 state={mode,list:[...a].sort(()=>Math.random()-.5),i:0,score:0};renderQuiz();
}
function renderQuiz(){
 const box=document.getElementById('quizArea');
 if(state.i>=state.list.length){box.innerHTML=`<div class="card center"><h3>完成</h3><p>得分：${state.score} / ${state.list.length}</p><button onclick="startQuiz(state.mode)">再来一次</button></div>`;return}
 const w=state.list[state.i], sc=state.mode==='sc', field=sc?'zh':'word';
 const q=sc?w.word:(w.zh+(w.pos?'  ['+w.pos+']':''));
 const opts=options(w[field],field);
 box.innerHTML=`<div class="word">${esc(q)}</div><div class="options">${opts.map(o=>`<button onclick="quizAnswer(this,${JSON.stringify(o)},${JSON.stringify(w[field])})">${esc(o)}</button>`).join('')}</div><div class="result" id="qr"></div><div class="small center">${state.i+1} / ${state.list.length}</div>`;
}
function quizAnswer(btn,val,correct){
 document.querySelectorAll('#quizArea button').forEach(b=>b.disabled=true);
 const ok=val===correct;
 btn.classList.add(ok?'correct':'wrong');
 if(!ok){document.querySelectorAll('#quizArea .options button').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});db.wrong[state.list[state.i].word]=true;persist()}else state.score++;
 document.getElementById('qr').textContent=ok?'正确 ✓':'错误，正确答案：'+correct;
 setTimeout(()=>{state.i++;renderQuiz()},650);
}
function startDict(){
 const a=allWords();if(!a.length){document.getElementById('dictArea').innerHTML='<div class="card">请先录入单词。</div>';return}
 state={mode:'dict',list:[...a].sort(()=>Math.random()-.5),i:0,score:0};renderDict();
}
function renderDict(){
 const box=document.getElementById('dictArea');
 if(state.i>=state.list.length){box.innerHTML=`<div class="card center"><h3>完成</h3><p>正确：${state.score} / ${state.list.length}</p><button onclick="startDict()">再来一次</button></div>`;return}
 const w=state.list[state.i];
 box.innerHTML=`<div class="prompt">${esc(w.zh)} ${w.pos?'<span class="pill">'+esc(w.pos)+'</span>':''}</div><input id="answer" autocapitalize="off" autocomplete="off" placeholder="输入西语"><button style="width:100%;margin-top:12px" onclick="dictAnswer()">检查</button><div class="result" id="dr"></div><div class="small center">${state.i+1} / ${state.list.length}</div>`;
}
function dictAnswer(){
 const w=state.list[state.i],v=document.getElementById('answer').value.trim(),ok=norm(v)===norm(w.word);
 if(ok)state.score++;else{db.wrong[w.word]=true;persist()}
 document.getElementById('dr').textContent=ok?'正确 ✓':'正确答案：'+w.word;
 setTimeout(()=>{state.i++;renderDict()},850);
}
function showWrongHome(){
 const n=Object.keys(db.wrong).length;
 document.getElementById('wrongArea').innerHTML=`<div class="card center">当前错题：<b>${n}</b> 个</div>`;
}
function startWrong(mode){
 const a=allWords().filter(w=>db.wrong[w.word]);
 if(!a.length){document.getElementById('wrongArea').innerHTML='<div class="card">目前没有错题。</div>';return}
 state={mode,list:[...a].sort(()=>Math.random()-.5),i:0,score:0};
 if(mode==='choice')renderWrongChoice();else renderWrongDict();
}
function renderWrongChoice(){
 const box=document.getElementById('wrongArea');
 if(state.i>=state.list.length){box.innerHTML=`<div class="card center"><h3>完成</h3><p>正确：${state.score} / ${state.list.length}</p></div>`;return}
 const w=state.list[state.i],opts=options(w.word,'word');
 box.innerHTML=`<div class="prompt">${esc(w.zh)} ${w.pos?'<span class="pill">'+esc(w.pos)+'</span>':''}</div><div class="options">${opts.map(o=>`<button onclick="wrongChoice(this,${JSON.stringify(o)},${JSON.stringify(w.word)})">${esc(o)}</button>`).join('')}</div><div class="result" id="wr"></div>`;
}
function wrongChoice(btn,val,correct){
 document.querySelectorAll('#wrongArea .options button').forEach(b=>b.disabled=true);
 const ok=val===correct;
 if(ok){state.score++;delete db.wrong[state.list[state.i].word];persist()}else btn.classList.add('wrong');
 document.getElementById('wr').textContent=ok?'正确 ✓':'正确答案：'+correct;
 setTimeout(()=>{state.i++;renderWrongChoice()},700);
}
function renderWrongDict(){
 const box=document.getElementById('wrongArea');
 if(state.i>=state.list.length){box.innerHTML=`<div class="card center"><h3>完成</h3><p>正确：${state.score} / ${state.list.length}</p></div>`;return}
 const w=state.list[state.i];
 box.innerHTML=`<div class="prompt">${esc(w.zh)} ${w.pos?'<span class="pill">'+esc(w.pos)+'</span>':''}</div><input id="wanswer" placeholder="输入西语"><button style="width:100%;margin-top:12px" onclick="wrongDictAnswer()">检查</button><div class="result" id="wr"></div>`;
}
function wrongDictAnswer(){
 const w=state.list[state.i],v=document.getElementById('wanswer').value.trim(),ok=norm(v)===norm(w.word);
 if(ok){state.score++;delete db.wrong[w.word];persist()}
 document.getElementById('wr').textContent=ok?'正确 ✓':'正确答案：'+w.word;
 setTimeout(()=>{state.i++;renderWrongDict()},850);
}
function exportData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='spanish_vocab_backup.json';a.click();
}
function importData(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.units)throw Error();db=x;persist();alert('导入成功');renderUnits()}catch{alert('文件格式不正确')}};r.readAsText(f);
}
</script>
</body>
</html>
